<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JPEG GeoTags to KML Converter</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.3.1/core.css">
    <link rel="stylesheet" href="photo-picker.css">
    <script type="module" src="https://pyscript.net/releases/2026.3.1/core.js"></script>
    <script src="pwa.py" config="conv_pys.json" type="py"></script>
    <script type="module" src="cloud.js"></script>
    <script src="convert_to_kml.js"></script>
</head>
<body>
    <div id="photo-picker-section">
        <label for="photo-picker">Select Photos:</label>
        <input type="file" id="photo-picker" multiple accept="image/jpeg">
        <div id="photo-count"></div>
        <label for="project-name">Project Name:</label>
        <input type="text" id="project-name" placeholder="Project Name" value="UntitledProject"><br />
        
        <a href="#" onclick="window.showCloudConfigForm(); return false;" id="show-cloud-settings">Show Cloud Settings</a>
        <div id="form-holder" style="display: none;">
            <a href="#" onclick="window.hideCloudConfigForm(); return false;" id="hide-cloud-settings">Hide Cloud Settings</a>
            <textarea id="cloud-settings" placeholder="Cloud Settings (JSON)" rows="12" cols="100"></textarea>
            <button id="validate-btn" onClick='window.validateUserConfig()' disabled>Validate</button>
            <button id="save-btn" onClick='window.saveUserConfig()' disabled>Save</button>
        </div>
        <button id="convert-btn" onClick='convertToKML()'>Convert to KML</button>
    </div>
    <div id="downloads-container" class="blue-outline"></div>
    <div id="thumbnails-container" class="blue-outline" style="max-height: 50vh; overflow-y: auto;"></div><br />
    <div id="conversion-log" class="blue-outline" style="max-height: 50vh; overflow-y: auto;"></div>
    <script src="photo-picker.js"></script>
</body>
</html>
